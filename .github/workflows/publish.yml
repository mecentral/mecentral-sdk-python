# Publish to PyPI when a version tag is pushed (v0.1.1, v1.0.0rc1 …).
# Copied into the split repo by tools/sdk.py. No secret needed: register this
# repository as a Trusted Publisher on PyPI (project → Publishing → GitHub:
# owner mecentral, repo mecentral-sdk-python, workflow publish.yml,
# environment pypi) and the job authenticates with its OIDC token.
name: publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - name: Tag must match pyproject.toml
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject $v"; exit 1; }
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
